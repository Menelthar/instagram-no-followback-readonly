name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: npm run check

      - name: Confirm no POST request method is present
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni 'method: "POST"' src || grep -Rni "method: 'POST'" src; then
            echo "POST request found in read-only source."
            exit 1
          fi

      - name: Confirm no remote executable imports
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '<script[^>]+src=|importScripts\(' src; then
            echo "Remote executable dependency found."
            exit 1
          fi
