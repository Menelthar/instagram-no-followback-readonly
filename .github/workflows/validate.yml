name: Validate

on:
  push:
    branches: ["main", "v1.1.0-hardening"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build scanner
        run: npm run build

      - name: Confirm generated bundle is committed
        run: git diff --exit-code -- src/instagram-no-followback-readonly.js

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run automated tests
        run: npm test

      - name: Confirm read-only request policy
        shell: bash
        run: |
          if grep -RniE 'method[[:space:]]*:[[:space:]]*["'"']POST["'"']' lib src; then
            echo "Account-modifying request found in read-only source."
            exit 1
          fi

      - name: Confirm no remote executable imports
        shell: bash
        run: |
          if grep -RniE '<script[^>]+src=|importScripts\(|https?://[^[:space:]"'"']+\.js' lib src; then
            echo "Remote executable dependency found."
            exit 1
          fi
