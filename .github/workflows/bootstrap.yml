name: Complete repository publication

on:
  push:
    branches: ["main"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify prepared repository
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* > /tmp/repository.zip.b64
          test "$(wc -c < /tmp/repository.zip.b64)" -eq 37448
          base64 --decode /tmp/repository.zip.b64 > /tmp/repository.zip
          echo "54eb45c4901332ed328b6d038930fdcc5e0fc6581eea9f6cc8ac6243cde1c774  /tmp/repository.zip" | sha256sum --check --strict
          unzip -t /tmp/repository.zip
          mkdir -p /tmp/prepared-repository
          unzip -q /tmp/repository.zip -d /tmp/prepared-repository

      - name: Publish all non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/bootstrap.yml /tmp/bootstrap.yml
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/prepared-repository/. ./
          rm -f .github/workflows/validate.yml
          mkdir -p .github/workflows
          cp /tmp/bootstrap.yml .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete v1.0.0 repository"
          git push
