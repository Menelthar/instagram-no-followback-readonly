name: Publish prepared repository

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/bootstrap.yml"
      - ".bootstrap/repository.zip.b64"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract prepared repository
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/repository.zip.b64
          mkdir -p /tmp/prepared-repository
          base64 --decode .bootstrap/repository.zip.b64 > /tmp/repository.zip
          unzip -q /tmp/repository.zip -d /tmp/prepared-repository
          cp -a /tmp/prepared-repository/. ./
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit published files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish complete v1.0.0 repository"
          git push
